<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBill POS - Mobile Barcode & QR Scanner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-bg);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo-group h1 {
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .logo-group p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .nav-buttons button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .nav-buttons button.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        main {
            flex: 1;
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Scanner Area */
        .scanner-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 120px;
            border: 2px dashed var(--accent);
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .scan-options {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        .scan-btn {
            flex: 1;
            padding: 0.6rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .scan-btn:hover {
            border-color: var(--accent);
        }

        /* Cart Area */
        .cart-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .cart-items {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-weight: bold;
        }

        .item-barcode {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qty-btn {
            background: var(--border);
            color: var(--text-main);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
        }

        .bill-summary {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--success);
            border-top: 1px dashed var(--border);
            padding-top: 0.4rem;
            margin-top: 0.4rem;
        }

        .action-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.8rem;
        }

        .action-btn:hover {
            background: var(--accent-hover);
        }

        /* Product Catalog Form */
        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 1.5rem 0;
        }

        /* Printable Receipt */
        #printable-receipt {
            display: none;
            background: #fff;
            color: #000;
            padding: 15px;
            font-family: monospace;
            width: 280px;
            margin: 0 auto;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printable-receipt, #printable-receipt * {
                visibility: visible;
            }
            #printable-receipt {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
            }
        }
    </style>
    <!-- ZXing Library for Barcode & QR Decoding -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>

    <header>
        <div class="logo-group">
            <h1>QuickBill POS</h1>
            <p>Mobile Scanner & Billing System</p>
        </div>
        <div class="nav-buttons">
            <button class="active" onclick="switchTab('billing-tab', this)">Billing</button>
            <button onclick="switchTab('products-tab', this)">Products</button>
        </div>
    </header>

    <main>
        <!-- BILLING TAB -->
        <div id="billing-tab" class="tab-content active">
            
            <div class="scanner-card">
                <div class="video-container">
                    <video id="video"></video>
                    <div class="scanner-overlay"></div>
                </div>
                <div class="scan-options">
                    <button class="scan-btn" onclick="toggleCamera()">
                        📷 <span id="cam-toggle-text">Stop Camera</span>
                    </button>
                    <button class="scan-btn" onclick="document.getElementById('gallery-input').click()">
                        🖼️ Upload Photo
                    </button>
                    <input type="file" id="gallery-input" accept="image/*" style="display:none;" onchange="scanFromGallery(event)">
                </div>
            </div>

            <div class="cart-card">
                <div class="cart-header">
                    <h3>Current Bill</h3>
                    <button onclick="clearCart()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.8rem;">Clear All</button>
                </div>

                <ul id="cart-list" class="cart-items">
                    <div class="empty-state">No items added yet.<br>Scan barcode using camera or upload a photo.</div>
                </ul>

                <div class="bill-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax / GST (%)</span>
                        <input type="number" id="tax-rate" value="5" style="width: 40px; background:transparent; border:1px solid var(--border); color:#fff; text-align:right;" onchange="updateCartUI()">
                    </div>
                    <div class="summary-row total">
                        <span>Total Due</span>
                        <span id="total-due">₹0.00</span>
                    </div>
                </div>

                <button class="action-btn" onclick="printReceipt()">Print / Save Bill</button>
            </div>

        </div>

        <!-- PRODUCTS CATALOG TAB -->
        <div id="products-tab" class="tab-content">
            <div class="scanner-card">
                <h3>Add New Product</h3>
                <br>
                <div class="form-group">
                    <label>Barcode / QR Code Number</label>
                    <input type="text" id="prod-barcode" placeholder="Scan or enter code">
                </div>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" placeholder="Item name">
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="prod-price" placeholder="0.00">
                </div>
                <button class="action-btn" onclick="saveProduct()">Save Product</button>
            </div>

            <div class="cart-card">
                <h3>Saved Inventory</h3>
                <br>
                <ul id="catalog-list" class="cart-items">
                    <!-- Populated dynamically -->
                </ul>
            </div>
        </div>
    </main>

    <!-- PRINTABLE THERMAL RECEIPT FORMAT -->
    <div id="printable-receipt">
        <h2 style="text-align: center;">QUICKBILL STORE</h2>
        <p style="text-align: center; font-size: 11px;">Tax Invoice</p>
        <hr style="border: 0.5px dashed #000; margin: 8px 0;">
        <div id="receipt-date" style="font-size: 11px;"></div>
        <hr style="border: 0.5px dashed #000; margin: 8px 0;">
        <div id="receipt-items"></div>
        <hr style="border: 0.5px dashed #000; margin: 8px 0;">
        <div id="receipt-totals" style="font-size: 12px; font-weight: bold;"></div>
        <hr style="border: 0.5px dashed #000; margin: 8px 0;">
        <p style="text-align: center; font-size: 11px;">Thank You! Visit Again.</p>
    </div>

    <script>
        // Data Models
        let catalog = JSON.parse(localStorage.getItem('pos_catalog')) || {
            '8904279401679': { name: 'Demo Product 1', price: 50 },
            '123456789': { name: 'Demo Product 2', price: 120 }
        };
        let cart = [];
        let codeReader = null;
        let isCameraActive = false;

        // Initialize App
        window.addEventListener('load', () => {
            initScanner();
            renderCatalog();
        });

        // Tab Switching
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-buttons button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Initialize ZXing Live Scanner
        function initScanner() {
            codeReader = new ZXing.BrowserMultiFormatReader();
            startCamera();
        }

        function startCamera() {
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result) {
                    playBeep();
                    handleScannedBarcode(result.text);
                }
            }).then(() => {
                isCameraActive = true;
                document.getElementById('cam-toggle-text').innerText = 'Stop Camera';
            }).catch((err) => {
                console.error("Camera access error:", err);
            });
        }

        function stopCamera() {
            if (codeReader) {
                codeReader.reset();
                isCameraActive = false;
                document.getElementById('cam-toggle-text').innerText = 'Start Camera';
            }
        }

        function toggleCamera() {
            if (isCameraActive) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        // Scan from Gallery Photo
        function scanFromGallery(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const galleryReader = new ZXing.BrowserMultiFormatReader();
                    galleryReader.decodeFromImageElement(img)
                        .then(result => {
                            playBeep();
                            handleScannedBarcode(result.text);
                        })
                        .catch(err => {
                            alert("इस फोटो में बारकोड या QR कोड नहीं मिला। कृपया साफ़ फोटो का इस्तेमाल करें।");
                        });
                };
            };
            reader.readAsDataURL(file);
        }

        // Process Scanned Barcode/QR Code
        function handleScannedBarcode(barcode) {
            if (catalog[barcode]) {
                addToCart(barcode, catalog[barcode].name, catalog[barcode].price);
            } else {
                let name = prompt(`Barcode '${barcode}' not found in catalog!\nEnter Product Name to quick add:`);
                if (name) {
                    let price = parseFloat(prompt(`Enter Price (₹) for ${name}:`) || "0");
                    catalog[barcode] = { name: name, price: price };
                    localStorage.setItem('pos_catalog', JSON.stringify(catalog));
                    renderCatalog();
                    addToCart(barcode, name, price);
                }
            }
        }

        // Cart Operations
        function addToCart(barcode, name, price) {
            let existingItem = cart.find(item => item.barcode === barcode);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ barcode, name, price, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(barcode, delta) {
            let item = cart.find(i => i.barcode === barcode);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.barcode !== barcode);
                }
            }
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            if (cart.length === 0) {
                cartList.innerHTML = `<div class="empty-state">No items added yet.<br>Scan product code or search manually</div>`;
                document.getElementById('subtotal').innerText = '₹0.00';
                document.getElementById('total-due').innerText = '₹0.00';
                return;
            }

            cartList.innerHTML = '';
            let subtotal = 0;

            cart.forEach(item => {
                let itemTotal = item.price * item.qty;
                subtotal += itemTotal;

                let li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-barcode">₹${item.price.toFixed(2)} x ${item.qty}</span>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="changeQty('${item.barcode}', -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty('${item.barcode}', 1)">+</button>
                        <span style="font-weight:bold; margin-left:8px;">₹${itemTotal.toFixed(2)}</span>
                    </div>
                `;
                cartList.appendChild(li);
            });

            let taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
            let taxAmount = subtotal * (taxRate / 100);
            let totalDue = subtotal + taxAmount;

            document.getElementById('subtotal').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('total-due').innerText = `₹${totalDue.toFixed(2)}`;
        }

        // Save New Product to Inventory Catalog
        function saveProduct() {
            let barcode = document.getElementById('prod-barcode').value.trim();
            let name = document.getElementById('prod-name').value.trim();
            let price = parseFloat(document.getElementById('prod-price').value);

            if (!barcode || !name || isNaN(price)) {
                alert('Please fill all fields accurately.');
                return;
            }

            catalog[barcode] = { name, price };
            localStorage.setItem('pos_catalog', JSON.stringify(catalog));
            renderCatalog();
            
            document.getElementById('prod-barcode').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            alert('Product Saved Successfully!');
        }

        function renderCatalog() {
            const list = document.getElementById('catalog-list');
            list.innerHTML = '';
            for (let code in catalog) {
                let li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${catalog[code].name}</span>
                        <span class="item-barcode">Code: ${code}</span>
                    </div>
                    <span style="font-weight:bold;">₹${catalog[code].price.toFixed(2)}</span>
                `;
                list.appendChild(li);
            }
        }

        // Sound Feedback
        function playBeep() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        // Print Bill Function
        function printReceipt() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            document.getElementById('receipt-date').innerText = "Date: " + new Date().toLocaleString();
            let itemsHtml = '';
            let subtotal = 0;

            cart.forEach(item => {
                let total = item.price * item.qty;
                subtotal += total;
                itemsHtml += `
                    <div style="display:flex; justify-content:space-between; font-size:12px;">
                        <span>${item.name} x${item.qty}</span>
                        <span>₹${total.toFixed(2)}</span>
                    </div>
                `;
            });

            let taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
            let taxAmount = subtotal * (taxRate / 100);
            let grandTotal = subtotal + taxAmount;

            document.getElementById('receipt-items').innerHTML = itemsHtml;
            document.getElementById('receipt-totals').innerHTML = `
                <div style="display:flex; justify-content:space-between;"><span>Subtotal:</span><span>₹${subtotal.toFixed(2)}</span></div>
                <div style="display:flex; justify-content:space-between;"><span>GST (${taxRate}%):</span><span>₹${taxAmount.toFixed(2)}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:14px; margin-top:4px;"><span>Total:</span><span>₹${grandTotal.toFixed(2)}</span></div>
            `;

            window.print();
        }
    </script>
</body>
</html>
